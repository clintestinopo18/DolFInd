<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
  <title>Set a new password | DolFind</title>
  <link rel="icon" type="image/jpeg" href="assets/brand/dolfind-mascot-badge.jpg">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/design.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="navbar"><a class="logo" href="index.html">DolFind</a><nav aria-label="Main navigation"><a href="login.html">Log in</a></nav></header>
  <main id="main" class="auth-container"><section class="form-card" aria-labelledby="reset-title">
    <h1 id="reset-title">Set a new password</h1>
    <p id="reset-intro" class="form-description">Checking your reset link...</p>
    <p id="reset-message" class="message" role="status" aria-live="polite"></p>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-help">
      <small id="password-help">Use at least 8 characters. A longer, unique password is better.</small>
      <label for="confirm-new-password">Confirm new password</label><input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button id="save-password" type="submit">Save new password</button>
    </form>
    <p id="reset-retry" class="form-link" hidden><a href="forgot-password.html">Request a new reset link</a></p>
    <p id="reset-success" class="form-link" hidden><a class="button-link" href="login.html">Log in with your new password</a></p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/reset-password.js"></script><script src="js/ui.js"></script>
</body>
</html>
