<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex"><title>Forgot password | DolFind</title>
  <link rel="icon" type="image/jpeg" href="assets/brand/dolfind-mascot-badge.jpg">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/design.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="navbar"><a class="logo" href="index.html">DolFind</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="login.html">Log in</a></nav></header>
  <main id="main" class="auth-container"><section class="form-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title">Forgot your password?</h1>
    <p class="form-description">Enter the PCU email you registered with. We will send you a link to choose a new password.</p>
    <form id="forgot-form">
      <label for="recovery-email">PCU email address</label><input id="recovery-email" type="email" autocomplete="email" maxlength="254" placeholder="your.name@pcu.edu.ph" required>
      <button id="send-reset" type="submit">Send reset link</button>
      <p id="recovery-message" class="message" role="status" aria-live="polite"></p>
    </form>
    <p id="recovery-email-help" class="form-description" hidden>Check your inbox and spam folder. Use the newest reset email. You can request another link after one minute.</p>
    <p class="form-link"><a href="login.html">Back to log in</a></p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/forgot-password.js"></script><script src="js/ui.js"></script>
</body>
</html>
